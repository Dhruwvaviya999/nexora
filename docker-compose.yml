# Full stack: Postgres (with pgvector), Redis, the API, a Celery worker and the
# Next.js frontend.
#
#   cp .env.docker.example .env
#   docker compose up --build
#
#   API       http://localhost:8000/api/v1
#   Frontend  http://localhost:3000
#
# The web and worker services run the same image; only the command differs, so
# they cannot drift apart.

name: nexora

services:
  db:
    # pgvector's image is plain Postgres with the extension already built, which
    # is what the DocumentChunk.embedding column needs.
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nexora}
      POSTGRES_USER: ${POSTGRES_USER:-nexora}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nexora}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      # Dependants wait on this, so the API never starts against a database
      # that is still initialising.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nexora} -d ${POSTGRES_DB:-nexora}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    # Persist the queue so a restart does not drop scheduled jobs.
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  web:
    build:
      context: ./backend
    # Continuation lines stay at the SAME indentation as the first: in a folded
    # (">") block, a more-indented line keeps its newline instead of folding to
    # a space, which would hand `sh -c` the arguments as separate commands and
    # leave uvicorn on its 127.0.0.1 default -- unreachable through the port map.
    command: >
      sh -c "python manage.py migrate --noinput &&
      uvicorn config.asgi:application --host 0.0.0.0 --port 8000 --workers 3"
    environment: &backend_env
      DJANGO_SETTINGS_MODULE: ${DJANGO_SETTINGS_MODULE:-config.settings.production}
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env}
      DEBUG: ${DEBUG:-False}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,web}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      DATABASE_URL: postgres://${POSTGRES_USER:-nexora}:${POSTGRES_PASSWORD:-nexora}@db:5432/${POSTGRES_DB:-nexora}
      REDIS_URL: redis://redis:6379/0
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      # TLS terminates at the proxy in front of this, not here.
      SECURE_SSL_REDIRECT: ${SECURE_SSL_REDIRECT:-False}
      # Email: unset EMAIL_HOST and the console backend keeps development quiet.
      EMAIL_BACKEND: ${EMAIL_BACKEND:-django.core.mail.backends.console.EmailBackend}
      EMAIL_HOST: ${EMAIL_HOST:-}
      EMAIL_PORT: ${EMAIL_PORT:-587}
      EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-Nexora <no-reply@nexora.app>}
      # AI providers (optional; the local embedding model needs no key).
      AI_LLM_PROVIDER: ${AI_LLM_PROVIDER:-gemini}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      AI_FIELD_ENCRYPTION_KEY: ${AI_FIELD_ENCRYPTION_KEY:-}
    volumes:
      - media:/app/media
      # Cache the embedding model so a restart doesn't re-download ~90MB.
      - huggingface_cache:/home/nexora/.cache/huggingface
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/v1/health/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  worker:
    build:
      context: ./backend
    # --concurrency 2 because each process holds its own copy of the embedding
    # model in memory.
    command: celery -A config worker --loglevel=info --concurrency=2
    environment: *backend_env
    volumes:
      - media:/app/media
      - huggingface_cache:/home/nexora/.cache/huggingface
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # CMD-SHELL, not CMD: the exec form does no variable expansion, so
      # "celery@$HOSTNAME" would be pinged literally and never answer.
      test: ["CMD-SHELL", "celery -A config inspect ping -d celery@$$(hostname) || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        # Baked into the client bundle at build time, so it must be the URL a
        # browser can reach -- not the internal service name.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api/v1}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      web:
        condition: service_started
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  media:
  huggingface_cache:
